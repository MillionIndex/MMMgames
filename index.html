<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Battle Cats Proto - Fixed & Clean</title>
  
  <!-- ① 外部データファイルを先に読み込む -->
  <script src="data/Cha.js"></script>

  <style>
    body { font-family: sans-serif; background-color: #2c3e50; color: #ecf0f1; text-align: center; margin: 0; padding: 20px; }
    #gameContainer { position: relative; width: 800px; margin: 0 auto; }
    canvas { border: 4px solid #34495e; border-radius: 8px; background: linear-gradient(to bottom, #87CEEB, #E0F7FA); display: block; }

    #uiArea { width: 800px; margin: 15px auto 0; background: #34495e; padding: 15px; border-radius: 8px; display: flex; justify-content: space-around; align-items: center; box-sizing: border-box; }
    #moneyDisplay { font-size: 20px; font-weight: bold; color: #f1c40f; }
    .unit-buttons { display: flex; gap: 10px; }
    button { padding: 10px 15px; font-size: 14px; cursor: pointer; background-color: #e67e22; color: white; border: none; border-radius: 4px; }
    button:disabled { background-color: #95a5a6; cursor: not-allowed; }

    #overlay { display: none; position: absolute; top: 0; left: 0; width: 800px; height: 300px; background: rgba(0,0,0,0.7); border-radius: 8px; justify-content: center; align-items: center; flex-direction: column; }
    #overlay h1 { font-size: 64px; margin: 0; }
    .win #overlay h1 { color: #2ecc71; }
    .lose #overlay h1 { color: #e74c3c; }
  </style>
</head>
<body>

<div id="gameContainer">
  <canvas id="gameCanvas" width="800" height="300"></canvas>
  <div id="overlay">
    <h1 id="resultText"></h1>
    <button onclick="resetGame()">リトライ</button>
  </div>
</div>

<div id="uiArea">
  <span id="moneyDisplay">所持金: 0円</span>
  <div class="unit-buttons">
    <button id="btn0" onclick="spawnPlayer(0)">味方1 (100円)</button>
    <button id="btn1" onclick="spawnPlayer(1)">味方2 (250円)</button>
    <button id="btn2" onclick="spawnPlayer(2)">味方3 (500円)</button>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const resultText = document.getElementById('resultText');
const moneyDisplay = document.getElementById('moneyDisplay');

let state = 'playing';
let money = 0;
const MAX_MONEY = 1000;
let playerBase, enemyBase, players, enemies;
let spawnInterval;

function initGame() {
  state = 'playing';
  money = 0;
  playerBase = { x: 50, hp: 1000, maxHp: 1000 };
  enemyBase = { x: 750, hp: 1000, maxHp: 1000 };
  players = [];
  enemies = [];
  overlay.style.display = 'none';
  document.getElementById('gameContainer').className = '';
  
  clearInterval(spawnInterval);
  spawnInterval = setInterval(() => {
    if (state !== 'playing') return;
    spawnEnemy(Math.random() < 0.3 ? 'strong' : 'basic');
  }, 4000);
}

// リソース自動加算
setInterval(() => {
  if (state !== 'playing') return;
  money = Math.min(MAX_MONEY, money + 10);
  updateUi();
}, 200);

function updateUi() {
  moneyDisplay.innerText = `所持金: ${money}円`;
  playerUnitDb.forEach((u, i) => {
    const btn = document.getElementById(`btn${i}`);
    if (btn) btn.disabled = (money < u.cost);
  });
}

function spawnPlayer(unitId) {
  if (state !== 'playing') return;
  // Cha.js から取得したデータベースを参照
  const unitData = playerUnitDb.find(u => u.id === unitId);
  if (!unitData || money < unitData.cost) return;

  money -= unitData.cost;
  updateUi();

  // ディープコピーして独立したインスタンスを作成
  players.push({
    ...unitData,
    maxHp: unitData.hp,
    x: playerBase.x + 20
  });
}

function spawnEnemy(type) {
  const unitData = enemyUnitDb[type];
  enemies.push({
    ...unitData,
    maxHp: unitData.hp,
    x: enemyBase.x - 20
  });
}

// --- 高速・軽量化された更新処理 ---
function update() {
  if (state !== 'playing') return;

  const dt = 1 / 60; // 60FPS前提のデルタタイム

  // 味方の処理
  for (let i = players.length - 1; i >= 0; i--) {
    const p = players[i];
    
    // 最前線の敵を探す（配列の先頭に近い敵）
    let target = null;
    for (let j = 0; j < enemies.length; j++) {
      if (enemies[j].x > p.x && enemies[j].x - p.x <= p.range) {
        target = enemies[j];
        break; // 最初に見つかった敵（最前線）だけ攻撃してループを抜ける
      }
    }

    if (target) {
      target.hp -= p.atk * dt; // 爆速ヒット処理
    } else if (enemyBase.x - p.x <= p.range) {
      enemyBase.hp -= p.atk * dt;
    } else {
      p.x += p.speed;
    }
  }

  // 敵の処理
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];

    let target = null;
    for (let j = 0; j < players.length; j++) {
      if (players[j].x < e.x && e.x - players[j].x <= e.range) {
        target = players[j];
        break;
      }
    }

    if (target) {
      target.hp -= e.atk * dt;
    } else if (e.x - playerBase.x <= e.range) {
      playerBase.hp -= e.atk * dt;
    } else {
      e.x -= e.speed;
    }
  }

  // 体力ゼロのユニットを削除（軽量フィルタリング）
  players = players.filter(p => p.hp > 0);
  enemies = enemies.filter(e => e.hp > 0);

  // 勝敗判定
  if (enemyBase.hp <= 0) endGame('win', '勝利');
  if (playerBase.hp <= 0) endGame('lose', '敗北');
}

function endGame(resultClass, message) {
  state = resultClass;
  resultText.innerText = message;
  document.getElementById('gameContainer').className = resultClass;
  overlay.style.display = 'flex';
}

function resetGame() {
  initGame();
}

// 描画処理
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 地面
  ctx.beginPath();
  ctx.strokeStyle = '#7e5c3e'; ctx.lineWidth = 3;
  ctx.moveTo(0, 250); ctx.lineTo(800, 250); ctx.stroke();

  // 拠点
  ctx.fillStyle = '#34495e'; ctx.fillRect(playerBase.x - 20, 150, 40, 100);
  ctx.fillStyle = '#c0392b'; ctx.fillRect(enemyBase.x - 20, 150, 40, 100);

  // 敵城HP
  ctx.fillStyle = 'black'; ctx.font = 'bold 14px sans-serif';
  ctx.fillText(`敵城: ${Math.max(0, Math.ceil(enemyBase.hp))}`, enemyBase.x - 30, 140);

  // ユニット描画
  players.forEach(p => {
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - 10, 220, 20, 30);
  });

  enemies.forEach(e => {
    ctx.fillStyle = e.color;
    ctx.fillRect(e.x - 10, 220, 20, 30);
  });

  // 自分城のHPバー（最下部）
  const barW = 760, barH = 20, barX = 20, barY = 270;
  ctx.fillStyle = '#7f8c8d';
  ctx.fillRect(barX, barY, barW, barH);

  const hpRatio = Math.max(0, playerBase.hp / playerBase.maxHp);
  ctx.fillStyle = hpRatio > 0.5 ? '#2ecc71' : (hpRatio > 0.2 ? '#f1c40f' : '#e74c3c');
  ctx.fillRect(barX, barY, barW * hpRatio, barH);

  ctx.fillStyle = 'white'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(`自城 HP: ${Math.max(0, Math.ceil(playerBase.hp))} / ${playerBase.maxHp}`, 400, barY + 14);
  ctx.textAlign = 'start';
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

initGame();
loop();
</script>
</body>
</html>
